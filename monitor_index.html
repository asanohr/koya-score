<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バーチャル高野連</title>
  <style>
    :root {
      --bg:#f0f4f8; --surface:#fff; --surface2:#f5f7fa; --border:#dde3ed;
      --text:#1a1d27; --text-dim:#555; --accent:#1d6fd8;
      --new:#6b7280; --new-bg:rgba(107,114,128,.12);
      --updated:#dc2626; --updated-bg:rgba(220,38,38,.08);
      --win:#16a34a; --lose:#555;
      --status-end:#1d6fd8; --status-play:#92400e; --radius:10px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;font-size:14px;}

    /* ── ヘッダー ── */
    header{
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:10px 20px;display:flex;align-items:center;justify-content:space-between;
      flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100;
    }
    header h1{font-size:15px;font-weight:700;color:var(--accent);white-space:nowrap;}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .status-bar{font-size:12px;color:var(--text-dim);}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;}
    .dot.ok{background:var(--win);} .dot.err{background:var(--accent);} .dot.ing{background:var(--updated);animation:blink 1s ease infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .gh-status{font-size:11px;color:var(--text-dim);white-space:nowrap;}
    .btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;transition:opacity .15s;font-family:inherit;}
    .btn:hover{opacity:.85;} .btn:disabled{opacity:.45;cursor:default;}
    .btn.sub{background:var(--surface2);color:var(--text-dim);border:1px solid var(--border);}
    .btn.sm{padding:3px 8px;font-size:11px;}
    .countdown{font-size:12px;color:var(--text-dim);min-width:90px;}
    .ses-warn{margin:0 14px 10px;padding:9px 12px;border:1px solid #f0c000;border-left:3px solid #f0c000;
      border-radius:5px;background:#fffbe6;color:#6b4e00;font-size:12.5px;line-height:1.7;}
    .ses-warn b{color:#8a3d00;}
    .ses-warn .acts{margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;}
    .ses-warn button{font-size:11.5px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:inherit;
      border:1px solid #d9ae00;background:#fff;color:#6b4e00;}
    .ses-warn button.primary{background:#f0c000;border-color:#d9ae00;color:#3d2c00;font-weight:700;}
    .fetch-stats{font-size:12px;color:var(--text-dim);margin-left:8px;white-space:nowrap;}
    .fetch-stats.warn{color:#dc2626;font-weight:600;}
    .spinner{display:none;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .sep{width:1px;height:20px;background:var(--border);flex-shrink:0;}

    /* ── 設定パネル ── */
    .panel{background:var(--surface);border-bottom:2px solid var(--accent);}
    .panel-inner{max-width:1100px;margin:0 auto;padding:14px 20px;}
    .panel h2{font-size:13px;font-weight:700;color:var(--text-dim);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em;}
    .cfg-grid{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;}
    .cfg-grid label{font-size:12px;color:var(--text-dim);white-space:nowrap;}
    .cfg-grid input{
      background:var(--surface2);color:var(--text);border:1px solid var(--border);
      border-radius:5px;padding:5px 9px;font-size:13px;font-family:inherit;
    }
    .cfg-grid input:focus{outline:2px solid var(--accent);}
    #cfgStatus{font-size:12px;margin-left:8px;}

    /* ── セッションパネル ── */
    .session-panel{background:#eef4ff;border-bottom:1px solid #c7d8f5;}
    .session-inner{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:14px 30px;align-items:flex-end;}
    .ses-field{display:flex;flex-direction:column;gap:4px;}
    .ses-field label{font-size:11px;font-weight:700;color:#3d5a99;text-transform:uppercase;letter-spacing:.04em;}
    .ses-field input{
      background:#fff;color:var(--text);border:1px solid #aabde0;
      border-radius:5px;padding:5px 9px;font-size:13px;font-family:inherit;
    }
    .ses-field input:focus{outline:2px solid var(--accent);}
    .ses-field .row{display:flex;align-items:center;gap:6px;}
    .date-badge{
      display:inline-block;background:var(--accent);color:#fff;
      border-radius:4px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;
    }
    .field-error{font-size:11px;color:#dc2626;}

    /* ── メイン ── */
    main{max-width:1100px;margin:0 auto;padding:18px 14px 40px;}
    .legend{display:flex;gap:12px;flex-wrap:wrap;}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim);}
    .badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;}
    .badge.new    {background:var(--new-bg);    color:var(--new);     border:1px solid rgba(107,114,128,.3);}
    .badge.updated{background:var(--updated-bg);color:var(--updated); border:1px solid rgba(220,38,38,.4);}
    .badge.playing{background:#fef3c7;color:var(--status-play);border:1px solid rgba(180,83,9,.3);}
    .badge.ended  {background:rgba(29,111,216,.08);color:var(--status-end);border:1px solid rgba(29,111,216,.4);}

    /* ── 2カラムグリッド ── */
    .region-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
    .region-col{display:flex;flex-direction:column;gap:16px;}
    @media(max-width:800px){
      .region-grid{grid-template-columns:1fr;}
      .region-grid .region-col:last-child{margin-top:0;}
    }

    /* ── カード ── */
    .region-section{margin-bottom:0;}
    .region-header{font-size:15px;font-weight:700;color:var(--text-dim);border-left:3px solid var(--accent);padding-left:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
    .region-toggle-btn{font-size:11px;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:background .15s;}
    .region-toggle-btn:hover{background:var(--border);}
    .game-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .3s;}
    .game-card.is-new    {border-color:rgba(107,114,128,.5); animation:pulse-new 1.5s ease 3;}
    .game-card.is-updated{border-color:rgba(255,77,77,.5);  animation:pulse-upd 1.5s ease 3;}
    @keyframes pulse-new{0%,100%{box-shadow:0 0 0 0 rgba(107,114,128,0)}  50%{box-shadow:0 0 0 4px rgba(107,114,128,.25)}}
    @keyframes pulse-upd{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}   50%{box-shadow:0 0 0 4px rgba(255,77,77,.2)}}
    .card-header{padding:8px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
    .card-header:hover{background:rgba(0,0,0,.02);}
    .card-round-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
    .card-round{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;}
    .card-time{font-size:11px;color:var(--text-dim);white-space:nowrap;flex-shrink:0;}
    .card-toggle-btn{font-size:12px;color:var(--text-dim);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:3px 10px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;transition:background .15s;}
    .card-toggle-btn:hover{background:var(--border);}
    /* スコア表：常に表示 */
    .card-score{border-top:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;}
    /* 詳細パネル：開くで表示 */
    .card-detail{border-top:1px solid var(--border);}
    .card-detail.collapsed{display:none;}
    /* カスタムカード互換 */
    .card-body.collapsed{display:none;}
    .score-table{width:100%;border-collapse:collapse;}
    .score-table th,.score-table td{text-align:center;padding:4px 3px;border-top:1px solid var(--border);min-width:30px;}
    .score-table th{font-size:11px;color:var(--text-dim);font-weight:600;background:var(--surface2);}
    .score-table td.team-name{text-align:left;padding-left:9px;font-weight:700;font-size:14px;min-width:70px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .score-table td.inn{font-size:13px;font-weight:700;color:var(--text-dim);}
    .score-table td.inn.scored{color:var(--text);}
    .score-table td.total{font-size:16px;font-weight:800;border-left:1px solid var(--border);}
    .score-table td.total.win{color:var(--win);} .score-table td.total.lose{color:var(--lose);}
    .game-card.is-new td.scored,.game-card.is-new td.total{color:var(--updated)!important;}
    .game-card.is-updated td.changed{color:var(--updated)!important;}
    .badge.updated{cursor:pointer;}
    .badge.updated:hover{opacity:.8;}
    .commentary-toggle{width:100%;text-align:left;padding:6px 14px;background:none;border:none;border-top:1px solid var(--border);color:var(--text-dim);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;}
    .commentary-toggle:hover{background:rgba(0,0,0,.02);}
    .commentary-body{display:none;padding:10px 14px;font-size:12px;color:var(--text-dim);line-height:1.7;border-top:1px solid var(--border);background:var(--surface2);}
    .commentary-body.open{display:block;}

    /* ── 埋め込みパネル ── */
    .embed-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);border-radius:5px;color:var(--text-dim);font-size:11px;font-family:inherit;padding:3px 9px;cursor:pointer;transition:background .15s;white-space:nowrap;flex-shrink:0;}
    .embed-btn:hover{background:var(--surface2);color:var(--text);}
    .embed-panel{display:none;border-top:1px solid var(--border);background:#f8f9fc;padding:10px 14px;}
    .embed-panel.open{display:block;}
    .embed-panel label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;}
    .embed-panel code{display:block;background:#eef1f7;border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:11px;word-break:break-all;color:var(--text);line-height:1.6;}
    .embed-copy-btn{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:opacity .15s;}
    .embed-copy-btn:hover{opacity:.85;} .embed-copy-btn.copied{background:var(--win);}

    /* ── メタ情報入力パネル ── */
    .meta-panel{background:#f0f5ff;border-top:1px solid var(--border);padding:10px 14px;}
    .meta-panel .meta-title{font-size:11px;font-weight:700;color:#3d5a99;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
    .meta-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
    .meta-row label{font-size:12px;color:var(--text-dim);white-space:nowrap;min-width:130px;}
    .meta-row input{flex:1;background:#fff;color:var(--text);border:1px solid #aabde0;border-radius:5px;padding:5px 9px;font-size:13px;font-family:inherit;}
    .meta-row input:focus{outline:2px solid var(--accent);outline-offset:0;}
    .meta-actions{display:flex;align-items:center;gap:10px;margin-top:4px;}
    .meta-save-btn{background:var(--accent);color:#fff;border:none;border-radius:5px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
    .meta-save-btn:hover{opacity:.85;} .meta-save-btn:disabled{opacity:.45;cursor:default;}
    .meta-preview{font-size:11px;color:var(--text-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* ── カスタムスコアセクション ── */
    .custom-section{max-width:1100px;margin:0 auto;padding:0 14px 48px;}
    .custom-section-title{font-size:15px;font-weight:700;color:var(--text);border-left:3px solid #d97757;padding-left:10px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
    .custom-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
    .custom-card-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .custom-card-title{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .custom-card-score{font-size:13px;color:var(--text-dim);white-space:nowrap;}
    .custom-card-body{border-top:1px solid var(--border);padding:10px 14px;background:var(--surface2);}
    .custom-card-body label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;}
    .custom-card-body code{display:block;background:#eef1f7;border:1px solid var(--border);border-radius:5px;padding:7px 10px;font-size:11px;word-break:break-all;color:var(--text);line-height:1.6;margin-bottom:6px;}
    .btn.danger{background:#dc2626;color:#fff;}

    .no-games{text-align:center;padding:60px 20px;color:var(--text-dim);font-size:15px;line-height:2;}
    @media(max-width:600px){
      .score-table th,.score-table td{padding:5px 2px;min-width:20px;font-size:13px;}
      .score-table td.team-name{min-width:90px;font-size:14px;}
      .score-table td.total{font-size:16px;}
    }
  </style>
</head>
<body>

<header>
  <h1>⚾ バーチャル高野連</h1>
  <div class="header-right">
    <div class="status-bar"><span class="dot" id="statusDot"></span><span id="statusText">読み込み中...</span><span class="fetch-stats" id="fetchStats"></span></div>
    <span class="gh-status" id="ghStatus"></span>
    <div class="countdown" id="countdown"></div>
    <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:6px;">
      間隔
      <select id="intervalSelect" onchange="setInterval_(this.value)"
        style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:12px;cursor:pointer;">
        <option value="0">更新なし</option>
        <option value="2">2分</option><option value="3">3分</option>
        <option value="4">4分</option><option value="5" selected>5分</option><option value="6">6分</option>
        <option value="7">7分</option><option value="8">8分</option><option value="9">9分</option>
        <option value="10">10分</option>
      </select>
    </label>
    <button class="btn" id="refreshBtn" onclick="manualCrawl()">
      <span class="spinner" id="spinner"></span> 今すぐ更新
    </button>
    <button class="btn sub" onclick="location.href='score_creator.html'">✏️ スコア作成</button>
    <div class="sep"></div>
    <button class="btn sub" onclick="toggleAll(true)">全スコアを開く</button>
    <button class="btn sub" onclick="toggleAll(false)">全スコアを閉じる</button>
    <button class="btn sub" onclick="openHistory()">📋 過去のスコア一覧</button>
    <button class="btn sub" onclick="toggleSettings()">⚙️ 設定</button>
  </div>
</header>

<!-- GitHub 設定パネル -->
<div class="panel" id="settingsPanel" style="display:none;">
  <div class="panel-inner">
    <h2>GitHub 接続設定</h2>
    <div class="cfg-grid">
      <label>Personal Access Token</label>
      <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxx" style="width:260px;">
      <label>Owner</label>
      <input id="cfgOwner" placeholder="asanohr" style="width:130px;">
      <label>Repository</label>
      <input id="cfgRepo" placeholder="koya-score" style="width:150px;">
      <label>Branch</label>
      <input id="cfgBranch" placeholder="main" style="width:90px;">
      <label>GitHub書き込み</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" id="cfgWriteEnabled" checked onchange="saveGitHubConfig()">
        <span id="cfgWriteLabel" style="font-size:12px;color:var(--text-dim);">この端末から書き込む（複数端末使用時は1台のみON）</span>
      </label>
      <button class="btn sm" onclick="saveGitHubConfig()">💾 保存</button>
      <button class="btn sm sub" onclick="testGitHub()">🔌 テスト接続</button>
      <span id="cfgStatus" style="font-size:12px;"></span>
    </div>
  </div>
</div>

<!-- 試合セッションパネル -->
<div class="session-panel">
  <div class="session-inner">
    <div class="ses-field">
      <label>大会名</label>
      <div class="row">
        <input id="sesName" placeholder="2026年春季大会" style="width:200px;" oninput="saveSession()">
      </div>
    </div>
    <div class="ses-field">
      <label>大会ID（URL用）</label>
      <div class="row">
        <input id="sesId" placeholder="2026spring" style="width:130px;" oninput="validateTournamentId(); saveSession()">
        <span id="sesIdErr" class="field-error"></span>
      </div>
    </div>
    <div class="ses-field">
      <label>試合日</label>
      <div class="row">
        <input type="date" id="sesDate" onchange="updateDateLabel(); saveSession()">
        <span class="date-badge" id="sesDateLabel" style="display:none;"></span>
      </div>
    </div>
    <div id="sesReadOnlyNote" style="display:none;font-size:11px;color:var(--text-dim);padding:2px 4px;align-self:center;">
      📖 読み取り専用 — 大会名・試合日は書き込みPCから自動取得
    </div>
    <div class="legend" style="margin-left:auto;margin-bottom:0;align-self:center;">
      <div class="legend-item"><span class="badge new">NEW</span> 新たな試合</div>
      <div class="legend-item"><span class="badge playing">試合中</span> プレー中</div>
      <div class="legend-item"><span class="badge updated">更新</span> 赤字を追加</div>
      <div class="legend-item"><span class="badge ended">終了</span> 試合終了</div>
    </div>
  </div>
  <div id="sesIdWarn" class="ses-warn" style="display:none;"></div>
</div>

<main id="mainContent">
  <div id="content"></div>
</main>

<!-- カスタムスコアセクション -->
<div class="custom-section">
  <div class="custom-section-title">
    <span>📝 カスタムスコア</span>
    <div style="display:flex;gap:8px;">
      <button class="btn sub sm" onclick="loadAndRenderManualScores()">🔄 更新</button>
      <button class="btn sub sm" onclick="location.href='score_creator.html'">＋ 新規作成</button>
    </div>
  </div>
  <div id="custom-scores-content">
    <div style="color:var(--text-dim);font-size:13px;padding:10px 0;">読み込み中...</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════
//  定数
// ═══════════════════════════════════════════════════
// このファイルの版。Console から作業するときに、新しい版が読み込まれているかの確認に使う
const APP_VERSION = '2026-09-21a';
const BASE_URL    = 'http://www.hyogo-koyaren.or.jp';
const INDEX_URL   = BASE_URL + '/taikai/result.php';
const CONFIG_KEY    = 'koya_config';
const SESSION_KEY   = 'koya_session';
const CURRENT_KEY   = 'koya_current';
const CONFIRMED_KEY = 'koya_confirmed'; // このPCの確認済みスナップショット（PC固有）
const GAME_META_KEY = 'koya_game_meta'; // 試合ごとの大会名・その他情報（PC固有）
const MANUAL_IDS_KEY  = 'koya_manual_ids';  // 手動作成スコアID一覧
const DELETED_IDS_KEY   = 'koya_deleted_ids';   // score_history で削除されたゲームIDブラックリスト
const COLLAPSED_RGNS_KEY = 'koya_collapsed_rgns'; // 閉じた会場名リスト
const SLOT_SEEN_KEY = 'koya_slot_seen'; // 枠ごとに「前回見た内容」と、それを記録した試合日
const ID_NAMES_KEY  = 'koya_id_names';  // 大会IDごとに「その名前で実際に書き込んだ」記録
const HIDDEN_REGIONS = []; // 全地区を表示（非表示にしたい地区があればここに追加）
// 取得の中継（自前の Cloudflare Worker）
// 2026-09-12 変更: 無料CORSプロキシ4本がすべて停止・仕様変更で使用不能になったため差し替え
//   旧: corsproxy.io（403 keyless_legacy_url） / allorigins（応答なし）
//       thingproxy（サービス停止） / codetabs（応答なし）
const PROXY_LIST = [
  u => 'https://koya-proxy.asanohr.workers.dev/?url=' + encodeURIComponent(u),
];

// ═══════════════════════════════════════════════════
//  状態
// ═══════════════════════════════════════════════════
let intervalMinutes = 5;
let nextCrawlAt = null, crawlTimer = null, countdownTimer = null, isCrawling = false;
let crawlCount = 0;   // 何回目のクロールか（終了済み枠の再取得タイミングに使う）
let noGameMode = false; // 今日はまだ試合が始まっていない（元サイトが前回の試合日のまま）
let reloadTimer = null, nextRefreshAt = null;
const openCards = new Set();
let workingProxyIdx = 0;

// 手元（ブラウザ）に保持する履歴の日数。これより古い試合日は localStorage から落とす。
// GitHub 側は書き込み時に統合するので消えず、過去のスコア一覧からは引き続き見られる。
const SAVED_KEEP_DAYS = 60;
function trimSavedGames(saved) {
  if (!Array.isArray(saved) || !saved.length) return saved || [];
  const limit = new Date(Date.now() - SAVED_KEEP_DAYS * 86400000).toISOString().slice(0, 10);
  const kept = saved.filter(g => !g.game_date || g.game_date >= limit);
  return kept.length ? kept : saved;   // 全部落ちてしまう場合は触らない
}

// ブラウザの保存容量には上限（およそ5MB）がある。
// 超えると setItem が例外を投げ、これまではクロール処理ごと静かに止まっていた。
function saveCurrentData(d) {
  const data = { ...d, saved_games: trimSavedGames(d.saved_games) };
  try {
    localStorage.setItem(CURRENT_KEY, JSON.stringify(data));
    return;
  } catch(e) {
    console.warn('保存に失敗。履歴を減らして再試行します:', e);
  }
  // ① 履歴を半分にして再試行
  try {
    const s = data.saved_games || [];
    localStorage.setItem(CURRENT_KEY, JSON.stringify({ ...data, saved_games: s.slice(-Math.ceil(s.length / 2)) }));
    setGhStatus('error', '⚠️ 保存容量が上限に近いため、手元の履歴を一部減らしました');
    return;
  } catch(e2) {}
  // ② それでも駄目なら履歴を諦める（GitHub 側には残る）
  try {
    localStorage.setItem(CURRENT_KEY, JSON.stringify({ ...data, saved_games: [] }));
    setGhStatus('error', '⚠️ 保存容量超過のため手元の履歴を消しました（GitHub側は残っています）');
  } catch(e3) {
    console.error('ブラウザへの保存ができませんでした:', e3);
    setGhStatus('error', '❌ ブラウザへの保存に失敗しました（⚙️設定から容量をご確認ください）');
  }
}

// ゲームがこのPCで未確認の更新があるか判定
// confirmed[g.id] が未登録 → 初回表示なので自動確認（赤字なし）
// confirmed[g.id] と現在スコアが異なる → 赤字
function localUpdateInfo(g, confirmed) {
  const snap = confirmed[g.id];
  if (snap === undefined) return { updated: false, prevSnap: null };
  const cur = scoreSnapshot(g);
  if (cur === snap) return { updated: false, prevSnap: null };
  return { updated: true, prevSnap: JSON.parse(snap) };
}

// 試合日（2026-07-13）から「7月13日」の形のラベルを作る
function dateLabelFrom(iso) {
  if (!iso) return '';
  const p = String(iso).slice(0, 10).split('-');
  if (p.length < 3) return '';
  return parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
}

// デフォルトのその他情報を生成（日付。回戦・会場はユーザーが自由記述）
// 過去の試合に今日の日付が付いてしまわないよう、その試合自身の試合日を優先する
function buildDefaultExtraInfo(g, session) {
  return dateLabelFrom(g?.game_date)
      || g?.game_date_label
      || session?.game_date_label
      || '';
}

// ゲームにメタ情報（大会名・その他情報）を付加して返す
// 【重要】すでに大会名・その他情報を持っている試合は、現在のセッションの値で上書きしない。
// 上書きすると、書き込みのたびに履歴の全試合が「今日の大会名・今日の日付」に
// 塗り替えられてしまう（7月の試合が「秋季大会 9月12日」になる不具合の原因）。
function enrichGamesWithMeta(games, session) {
  const meta = loadGameMeta();
  return games.map(g => {
    const m = meta[g.id] || {};
    return {
      ...g,
      tournament_name: m.tournament_name !== undefined ? m.tournament_name
                       : (g.tournament_name || session?.tournament_name || ''),
      extra_info:      m.extra_info      !== undefined ? m.extra_info
                       : (g.extra_info || buildDefaultExtraInfo(g, session)),
      note:            m.note            !== undefined ? m.note            : (g.note || ''),
      team1:           m.team1           !== undefined ? m.team1           : (g.team1 || ''),
      team2:           m.team2           !== undefined ? m.team2           : (g.team2 || ''),
    };
  });
}

// ゲームリストのうち、このPCで初めて見るゲームを自動確認登録
function autoConfirmNew(games) {
  const confirmed = loadConfirmed();
  let dirty = false;
  for (const g of games) {
    if (!(g.id in confirmed)) {
      confirmed[g.id] = scoreSnapshot(g);
      dirty = true;
    }
  }
  if (dirty) saveConfirmed(confirmed);
}

function autoTournamentId() {
  const d = new Date();
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const season = m <= 2 ? 'winter' : m <= 6 ? 'spring' : m <= 8 ? 'summer' : 'autumn';
  return y + season;
}
// 今日の日付を YYYY-MM-DD で返す（端末のローカル時刻）
function todayLocal() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
let lastKnownToday = todayLocal();

// 日付をまたいだら試合日を自動で切り替える
// ページを開きっぱなしにしていると init() が動かないため、前日の試合日のまま
// 取得を続けてしまう（今日の試合が前日の試合を上書きする）。1秒ごとに確認する。
function checkDateRollover() {
  const today = todayLocal();
  if (today === lastKnownToday) return;
  const prev = lastKnownToday;
  lastKnownToday = today;
  const el = document.getElementById('sesDate');
  if (!el) return;
  // ユーザーが意図して別の日付を選んでいる場合は触らない
  // （前日の日付が入っているときだけ、今日へ繰り上げる）
  if (el.value && el.value !== prev) return;
  el.value = today;
  updateDateLabel();
  saveSession();
  setGhStatus('ok', '📅 日付が変わりました（試合日を ' + today + ' に更新）');
  render();
}

function updateDateLabel() {
  const val = document.getElementById('sesDate').value;
  const el  = document.getElementById('sesDateLabel');
  if (!val) { el.style.display = 'none'; el.textContent = ''; return; }
  const [, m, d] = val.split('-');
  el.textContent = parseInt(m) + '月' + parseInt(d) + '日';
  el.style.display = 'inline-block';
}
function validateTournamentId() {
  const id  = document.getElementById('sesId').value;
  const err = document.getElementById('sesIdErr');
  if (!id || /^[a-zA-Z0-9_-]+$/.test(id)) { err.textContent = ''; return true; }
  err.textContent = '英数字・アンダースコア・ハイフンのみ';
  return false;

  if (!id) return;
  const m = loadIdNames();
  if (m[id] === name) return;
  m[id] = name;
  try { localStorage.setItem(ID_NAMES_KEY, JSON.stringify(m)); } catch(e) {}
  renderTournamentIdWarning();

  const id   = document.getElementById('sesId').value.trim();
  const name = document.getElementById('sesName').value.trim();
  const m = loadIdNames();
  m[id] = name;
  try { localStorage.setItem(ID_NAMES_KEY, JSON.stringify(m)); } catch(e) {}
  renderTournamentIdWarning();

  const el = document.getElementById('sesId');
  if (!el) return;
  el.value = sid;
  validateTournamentId();
  saveSession();
  renderTournamentIdWarning();

// 次の大会に使えそうなIDを提案する
function suggestTournamentId(currentId) {
  let s = autoTournamentId();
  if (s !== currentId) return s;
  for (let n = 2; n <= 9; n++) if (s + '-' + n !== currentId) return s + '-' + n;
  return s + '-2';
}

function renderTournamentIdWarning() {
  const box = document.getElementById('sesIdWarn');
  if (!box) return;
  const id   = (document.getElementById('sesId')?.value   || '').trim();
  const name = (document.getElementById('sesName')?.value || '').trim();
  const hide = () => { box.style.display = 'none'; box.innerHTML = ''; };
  if (!id || !name) return hide();

  const recorded = loadIdNames()[id];
  const thisYear = String(new Date().getFullYear());
  const idYear   = (id.match(/^(\d{4})/) || [])[1];

  let msg = '';
  if (recorded !== undefined && recorded !== name) {
    msg = '大会名を「<b>' + esc(recorded) + '</b>」から「<b>' + esc(name) + '</b>」に変えましたが、'
        + '大会IDは <b>' + esc(id) + '</b> のままです。';
  } else if (idYear && idYear !== thisYear) {
    msg = '大会ID <b>' + esc(id) + '</b> は ' + esc(idYear) + '年のものです。今年は ' + thisYear + '年です。';
  }
  if (!msg) return hide();

  const sid = suggestTournamentId(id);
  box.innerHTML = '⚠️ ' + msg
    + '<br>別の大会であれば新しいIDに変えてください。同じIDのままだと、'
    + '前の大会のファイルに今回の試合が混ざります。'
    + '<div class="acts">'
    + '<button class="primary" onclick="applySuggestedId(\'' + esc(sid) + '\')">' + esc(sid) + ' に変える</button>'
    + '<button onclick="acceptTournamentId()">このIDのまま続ける</button>'
    + '</div>';
  box.style.display = '';
}

// ═══════════════════════════════════════════════════
//  GitHub API
// ═══════════════════════════════════════════════════
async function ghRequest(method, path, body) {
  const cfg = loadConfig();
  if (!cfg.gh_token) throw new Error('GitHubトークンが未設定です（⚙️設定）');
  if (!cfg.gh_owner || !cfg.gh_repo) throw new Error('Owner/Repoが未設定です（⚙️設定）');
  const url = `https://api.github.com/repos/${cfg.gh_owner}/${cfg.gh_repo}/contents/${path}`;
  const opts = {
    method,
    headers: {
      'Authorization': 'token ' + cfg.gh_token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (res.status === 404) return null;
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error('GitHub API (' + res.status + '): ' + (e.message || '不明'));
  }
  return res.status === 204 ? null : await res.json();
}
async function ghRead(path) { return await ghRequest('GET', path); }

function ghEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function ghDecode(b64) {
  const bin = atob(b64.replace(/\n/g, ''));
  return new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

// mergeFn(リモートの中身, これから書く中身) → 実際に書く中身
// 指定すると、書き込み前に必ずリモートを読んで統合する。
// これにより「手元に無いものは消える」という上書き事故を防ぐ。
async function ghWrite(path, content, msg, mergeFn) {
  const existing = await ghRead(path);
  const build = (remoteFile) => {
    let payload = content;
    if (mergeFn && remoteFile?.content) {
      try { payload = mergeFn(JSON.parse(ghDecode(remoteFile.content)), content); }
      catch(e) { console.warn('統合に失敗したのでそのまま書き込みます:', e); }
    }
    return JSON.stringify(payload, null, 2);
  };
  let json = build(existing);
  warnIfLarge(path, json);
  const body = {
    message: msg || 'データ更新',
    content: ghEncode(json),
    branch:  loadConfig().gh_branch || 'main',
  };
  if (existing?.sha) body.sha = existing.sha;
  try {
    return await ghRequest('PUT', path, body);
  } catch(e) {
    // 409: SHA競合（他のタブ/デバイスが先に書き込んだ）
    // → 最新を読み直し、統合したうえで書き直す（相手の変更を消さない）
    if (e.message.includes('409')) {
      const fresh = await ghRead(path);
      body.content = ghEncode(build(fresh));
      if (fresh?.sha) body.sha = fresh.sha;
      return await ghRequest('PUT', path, body);
    }
    throw e;
  }
}

// GitHub の Contents API は 1MB を超えるファイルを読めなくなる。
// そこに近づいたら知らせる（黙って書き込めなくなる事態を避ける）
const GH_SIZE_WARN_BYTES = 800 * 1024;
function warnIfLarge(path, json) {
  const bytes = new TextEncoder().encode(json).length;
  if (bytes >= GH_SIZE_WARN_BYTES) {
    console.warn('ファイルが大きくなっています:', path, bytes, 'バイト');
    setGhStatus('error', '⚠️ ' + path + ' が ' + Math.round(bytes / 1024) + 'KB。1MBを超えると書き込めなくなります');
  }
}

// 大会ファイルの統合ルール
// games（当日分）は手元を正とし、saved_games（履歴）はリモートと足し合わせる。
// 手元の履歴を減らしても、GitHub 側の過去データが消えないようにするため。
function mergeTournamentData(remote, local) {
  const deleted = new Set(JSON.parse(localStorage.getItem(DELETED_IDS_KEY) || '[]'));
  const displayIds = new Set((local.games || []).map(g => g.id));
  const byId = {};
  // リモートの「当日分」のうち、手元の当日分に含まれないものは履歴へ回す。
  // 当日分は手元の内容で丸ごと置き換わるため、これが無いと、その日のデータを
  // 持っていない端末が書き込んだだけで、前回の試合日の記録が消えてしまう。
  for (const g of (remote.games || []))       if (!displayIds.has(g.id)) byId[g.id] = g;
  for (const g of (remote.saved_games || [])) byId[g.id] = g;
  for (const g of (local.saved_games  || [])) byId[g.id] = g;   // 手元の内容を優先
  return {
    ...remote,
    ...local,
    saved_games: Object.values(byId).filter(g => !displayIds.has(g.id) && !deleted.has(g.id)),
  };
}

// 大会一覧の統合ルール：リモートの一覧に、今回の分を足し込む
function mergeIndexData(remote, local) {
  const byId = {};
  for (const t of (remote.tournaments || [])) byId[t.id] = t;
  for (const t of (local.tournaments  || [])) byId[t.id] = t;   // 今回の更新を優先
  const tournaments = Object.values(byId)
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return { ...remote, ...local, tournaments };
}

async function updateTournamentIndex(session, gameCount, lastUpdated) {
  const path = 'data/index.json';
  let index = { tournaments: [] };
  const existing = await ghRead(path);
  if (existing?.content) {
    try { index = JSON.parse(ghDecode(existing.content)); } catch(e) {}
  }
  const idx  = index.tournaments.findIndex(t => t.id === session.tournament_id);
  const prev = idx >= 0 ? index.tournaments[idx] : null;
  const entry = {
    ...(prev || {}),   // type など既存の項目は残す
    id:           session.tournament_id,
    name:         session.tournament_name || session.tournament_id,
    date:         session.game_date || '',
    game_count:   gameCount,
    last_updated: lastUpdated,
  };
  // 最終更新時刻以外が前回と同じなら書き込まない。
  // 毎回書くと、試合結果の更新と合わせて短時間に2つのコミットができ、
  // GitHub Pages の公開処理が重なって先に走ったほうが失敗扱いになる
  // （メールで失敗通知が届く原因。公開内容そのものに影響はない）。
  const unchanged = prev
    && prev.name       === entry.name
    && prev.date       === entry.date
    && prev.game_count === entry.game_count;
  if (unchanged) return;

  if (idx >= 0) index.tournaments[idx] = entry; else index.tournaments.push(entry);
  index.tournaments.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  index.last_updated = lastUpdated;
  await ghWrite(path, index, '大会一覧更新', mergeIndexData);
}

// 1ページの取得を何秒で見切るか
const FETCH_TIMEOUT_MS = 10000;
// この割合まで取得できていなければ GitHub への書き込みを見送る（0.8 = 8割）
const WRITE_MIN_SUCCESS_RATE = 0.8;
// 1ページ取得するごとに空ける間隔（元サイトへの負荷を下げる）
const REQUEST_GAP_MS = 300;
// 終了した試合の枠も取得し直す頻度（12回に1度。日程変更・訂正への備え）
const RECHECK_FINISHED_EVERY = 12;
// 取得する時間帯。これ以外の時間は自動クロールを休む（手動更新はいつでも可能）
const ACTIVE_HOUR_START = 6;
const ACTIVE_HOUR_END   = 21;
// 今日まだ試合が始まっていないときの取得間隔（分）。試合が現れたら通常の間隔に戻る
const IDLE_INTERVAL_MINUTES = 15;
function isActiveHour() {
  const h = new Date().getHours();
  return h >= ACTIVE_HOUR_START && h < ACTIVE_HOUR_END;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

// 応答が本当にHTMLページかを確かめる
// （中継が止まったときのエラー応答をHTMLとして解析してしまわないため）
function looksLikeHtmlPage(buf) {
  if (buf.byteLength < 500) return false;                 // エラー応答は総じて短い
  const head = new TextDecoder('utf-8').decode(buf.slice(0, 2000)).toLowerCase();
  if (head.trimStart().startsWith('{')) return false;     // JSON形式のエラー応答
  return head.includes('<html');
}

async function fetchRaw(url) {
  // プロキシ側キャッシュを回避するためソースURLにタイムスタンプを付加
  const bustUrl = url + (url.includes('?') ? '&' : '?') + '_=' + Date.now();
  const order = [workingProxyIdx, ...PROXY_LIST.map((_,i)=>i).filter(i=>i!==workingProxyIdx)];
  const errors = [];
  for (const i of order) {
    // 応答が返らないまま待ち続けないよう、時間で打ち切る
    const ctrl  = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
    try {
      // ブラウザキャッシュも無効化
      const res = await fetch(PROXY_LIST[i](bustUrl), { cache: 'no-store', signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const buf = await res.arrayBuffer();
      if (!looksLikeHtmlPage(buf)) throw new Error('HTMLではない応答（' + buf.byteLength + 'バイト）');
      workingProxyIdx = i;
      return buf;
    } catch(e) {
      const msg = (e.name === 'AbortError')
        ? 'タイムアウト（' + (FETCH_TIMEOUT_MS / 1000) + '秒）'
        : e.message;
      errors.push('proxy' + i + ': ' + msg);
    } finally {
      clearTimeout(timer);
    }
  }
  throw new Error('取得失敗 (' + errors.join(' / ') + ')');
}
async function fetchHtml(url) {
  const buf  = await fetchRaw(url);
  const utf8 = new TextDecoder('utf-8').decode(buf);
  const m    = utf8.match(/charset=["\s]*([\w-]+)/i);
  const cs   = m ? m[1].toLowerCase() : '';
  if (cs === 'utf-8' || cs === 'utf8') return utf8;
  for (const enc of ['euc-jp', 'shift-jis']) {
    try { return new TextDecoder(enc).decode(buf); } catch(e) {}
  }
  return utf8;
}
function makeId(region, round, url, date) {
  // 日付を含めることで同じURLでも試合日が異なれば別IDになる
  const s = region + '|' + round + '|' + url + '|' + (date || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  return (h >>> 0).toString(16).padStart(8, '0');
}
async function fetchGameLinks() {
  const html = await fetchHtml(INDEX_URL);
  const doc  = new DOMParser().parseFromString(html, 'text/html');
  const results = [];
  doc.querySelectorAll('dl').forEach(dl => {
    const region = dl.querySelector('dt')?.textContent.trim() || '不明';
    dl.querySelectorAll('dd a[href]').forEach(a => {
      let href = a.getAttribute('href') || '';
      const round = a.textContent.trim();
      if (!href || !round) return;
      if (href.startsWith('../'))        href = BASE_URL + '/' + href.slice(3);
      else if (href.startsWith('/'))     href = BASE_URL + href;
      else if (!href.startsWith('http')) href = BASE_URL + '/baseball/' + href;
      results.push({ region, round, url: href });
    });
  });
  return results;
}

function parseScorePage(html, region, round, url) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let venue = '';
  for (const span of doc.querySelectorAll('span.px16')) {
    const t = span.textContent.trim();
    if (t.includes('会場')) { venue = t.replace(/試合会場[：:]/,'').trim(); break; }
  }
  const allTables = [...doc.querySelectorAll('table')];
  if (!allTables.length) return null;
  let scoreTable = null, scoreRows = [];
  for (const tbl of allTables) {
    const rows = [...tbl.querySelectorAll('tr[bgcolor="#000000"]')]
      .filter(r => r.querySelectorAll('td,th').length >= 10);
    if (rows.length >= 2) { scoreTable = tbl; scoreRows = rows.slice(0, 2); break; }
  }
  if (!scoreRows.length) return null;
  const c1 = [...scoreRows[0].querySelectorAll('td,th')];
  const c2 = [...scoreRows[1].querySelectorAll('td,th')];
  let team1 = (c1[0]?.textContent.trim() || '').replace(/[\s\u3000]/g, '');
  let team2 = (c2[0]?.textContent.trim() || '').replace(/[\s\u3000]/g, '');
  const nCols = Math.min(c1.length, c2.length);
  const innings1 = [], innings2 = [];
  for (let i = 1; i < nCols - 1; i++) {
    innings1.push(c1[i]?.textContent.trim() || '');
    innings2.push(c2[i]?.textContent.trim() || '');
  }
  const total1 = c1[nCols-1]?.textContent.trim() || '';
  const total2 = c2[nCols-1]?.textContent.trim() || '';
  const teamTable = allTables.find(t => t !== scoreTable && t.classList.contains('left'))
                 || allTables.find(t => t !== scoreTable);
  if ((!team1 || !team2) && teamTable) {
    const tc = [...(teamTable.querySelector('tr[bgcolor="#000000"]')?.querySelectorAll('td,th') || [])];
    if (!team1 && tc[0]) team1 = tc[0].textContent.trim().replace(/[\s\u3000]/g, '');
    if (!team2 && tc[3]) team2 = tc[3].textContent.trim().replace(/[\s\u3000]/g, '');
  }
  let commentary = '', gameStatus = '';
  for (const tbl of allTables) {
    if (tbl === scoreTable || tbl === teamTable) continue;
    const hasImg = [...tbl.querySelectorAll('img[src]')]
      .some(img => { const s = img.getAttribute('src') || ''; return s.includes('no_21') || s.includes('no_22'); });
    if (!hasImg) continue;
    const tc = [...(tbl.querySelector('tr[bgcolor="#000000"]')?.querySelectorAll('td,th') || [])];
    if (tc.length >= 2) { commentary = tc[0].textContent.trim(); gameStatus = tc[1].textContent.trim(); }
    else if (tc.length === 1) { gameStatus = tc[0].textContent.trim(); }
    break;
  }
  const allEmpty = !team1 && !team2
    && [...innings1,...innings2].every(s => s===''||s==='0')
    && (total1===''||total1==='0') && (total2===''||total2==='0');
  if (allEmpty) return null;
  return {
    id: makeId(region, round, url), region, round, venue,
    game_status: gameStatus, commentary,
    team1, team2, innings1, innings2, total1, total2, url,
    is_new: false, is_updated: false, last_changed: null,
  };
}
// チーム名から空白を取り除く（半角・全角の両方）
// 元サイトはチーム名を「津　　　名」のように空白で字数を揃えており、その詰め方が
// 日によって変わる。空白を残したままだと、同じ試合が別の内容と判定されてしまう。
function normTeam(s) { return String(s ?? '').replace(/[\s　]/g, ''); }

function scoreSnapshot(g) {
  return JSON.stringify({
    innings1: g.innings1, innings2: g.innings2, total1: g.total1, total2: g.total2,
    team1: normTeam(g.team1), team2: normTeam(g.team2),
  });
}

// ═══════════════════════════════════════════════════
//  「元サイトがまだ前回の試合日のまま」かどうかの判定
//  元サイトの view.php は、次の試合日の内容で上書きされるまで前回の結果を
//  表示し続ける。そのため試合のない日にクロールすると、前回の試合が
//  「今日の試合」として新しく登録されてしまう。
//  枠ごとに「前回見た内容」と「それを記録した試合日」を控えておき、
//  内容が同じまま日付だけ変わった場合は、今日の試合として扱わない。
// ═══════════════════════════════════════════════════
function slotKeyOf(region, round, url) { return region + '|' + round + '|' + url; }
function slotSignature(g) { return scoreSnapshot(g) + '|' + (g.game_status || ''); }

function loadSlotSeen() {
  try {
    const raw = localStorage.getItem(SLOT_SEEN_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  // 記録が無いときは、いま手元にある試合データから組み立てる
  // （これが無いと、導入直後の1回だけ前回の試合を取り込んでしまう）
  return buildSlotSeenFromGames();
}

// 手元の試合データから「枠ごとの前回の内容」を組み立てる
// 当日分だけでなく履歴も対象にする。近畿／全国大会や軟式のように毎日は
// 行われない枠は、当日分に無くても元サイトには前回の内容が残り続けるため、
// 当日分だけ見ていると、それを今日の試合として取り込んでしまう。
function buildSlotSeenFromGames() {
  const cur = loadCurrentData();
  const seeded = {};
  for (const g of [...(cur.games || []), ...(cur.saved_games || [])]) {
    if (!g.url || !g.game_date) continue;
    const k = slotKeyOf(g.region, g.round, g.url);
    // 同じ枠に複数の日付がある場合は新しい方を採用する
    if (!seeded[k] || seeded[k].date < g.game_date) {
      seeded[k] = { sig: slotSignature(g), date: g.game_date };
    }
  }
  return seeded;
}
// 同じ枠に、まったく同じ内容の試合が別の日付で入っていないか点検する。
// 過去の「いつの試合か」の取り違いの名残を見つけるためのもの。
// どちらが正しいかは機械的に決められないので、自動では消さず、画面で知らせるだけにする。
function findCrossDateDuplicates(games) {
  const bySlotSig = {};
  for (const g of (games || [])) {
    if (!g.url || !g.game_date) continue;
    const k = g.region + ' ' + g.round + '\u0001' + slotSignature(g);
    (bySlotSig[k] = bySlotSig[k] || new Set()).add(g.game_date);
  }
  return Object.entries(bySlotSig)
    .filter(([, dates]) => dates.size > 1)
    .map(([k, dates]) => k.split('\u0001')[0] + '（' + [...dates].sort().join(' / ') + '）');
}

function saveSlotSeen(s) {
  try { localStorage.setItem(SLOT_SEEN_KEY, JSON.stringify(s)); } catch(e) {}
}

// 試合日が誤って保存されていた場合に、その日付で記録した枠の観測を正しい日付へ移す。
// 対象は「いま試合として保持している内容と一致する枠」だけに限る。
// 前の試合日の内容が残っている枠まで付け替えると、それを今日の試合として
// 取り込んでしまうため、そこは元の日付のままにしておく。
function restampSlotSeen(fromDate, toDate) {
  if (!fromDate || !toDate || fromDate === toDate) return;
  const seen = loadSlotSeen();
  const held = new Set((loadCurrentData().games || []).map(g => slotSignature(g)));
  let n = 0;
  for (const k of Object.keys(seen)) {
    if (seen[k] && seen[k].date === fromDate && held.has(seen[k].sig)) {
      seen[k].date = toDate;
      n++;
    }
  }
  if (n) {
    saveSlotSeen(seen);
    console.warn('枠の記録', n, '件の日付を', fromDate, '→', toDate, 'に付け替えました');
  }
}

// ═══════════════════════════════════════════════════
//  Fetch & Update（クロール→GitHub書き込み）
// ═══════════════════════════════════════════════════
async function fetchAndUpdate() {
  const now     = new Date().toISOString().slice(0, 19);
  // 画面の試合日と保存されている試合日がずれていたら、画面の値に合わせる。
  // クロールは画面ではなく保存値を読むため、ここがずれると今日の試合に
  // 前日の日付が付き、前日の記録を上書きしてしまう。
  const uiDate    = document.getElementById('sesDate')?.value || '';
  const savedDate = loadSession().game_date || '';
  if (uiDate && uiDate !== savedDate) {
    console.warn('試合日の保存値がずれていたため合わせます:', savedDate, '→', uiDate);
    saveSession();
    // 誤った試合日で記録した「枠ごとの前回の内容」も付け替える。
    // これをしないと、その日のうちに取得済みだった試合が「前回の試合日のまま」と
    // 誤判定され、終了した試合がまとめて表示されなくなる。
    restampSlotSeen(savedDate, uiDate);
  }
  const session = loadSession();
  const tournamentId = session.tournament_id;

  if (!tournamentId || !validateTournamentId()) {
    saveCurrentData({ ...loadCurrentData(), fetch_stats:null, crawl_status:'error', error:'大会IDを設定してください（セッション欄）', last_updated:now });
    return;
  }

  let links;
  try { links = await fetchGameLinks(); }
  catch(e) {
    saveCurrentData({ ...loadCurrentData(), fetch_stats:null, crawl_status:'error', error:'試合一覧ページの取得に失敗: ' + String(e), last_updated:now });
    return;
  }

  // 旧データ（引き継ぎと、終了済み枠のスキップ判定に使う）
  const oldData          = loadCurrentData();
  const oldDisplayGames  = oldData.games        || [];
  const oldSavedGames    = oldData.saved_games  || [];
  // マージ比較は「今日の表示ゲーム」だけを対象にする
  // （過去履歴を含めると別日の試合が同一試合と誤認識されスコアが流入する危険がある）
  const oldById = Object.fromEntries(oldDisplayGames.map(g => [g.id, g]));

  // 何回かに1度は終了済みの枠も取得し直す（日程変更や記録訂正に備える）
  crawlCount++;
  const fullScan = (crawlCount % RECHECK_FINISHED_EVERY) === 1;

  const newGames = [];
  // 取得の成否を数える（改修の効果測定と、異常の早期発見のため）
  let fetchOk = 0;
  const failedLinks  = [];   // 取得そのものに失敗した枠
  const emptyLinks   = [];   // 取得はできたが中身が空だった枠（深夜の表示切替など）
  const skippedLinks = [];   // 終了済みのため取得を省いた枠
  const staleLinks   = [];   // 内容が前回の試合日のままだった枠（今日はまだ試合なし）
  const slotSeen     = loadSlotSeen();
  let slotSeenDirty  = false;
  const todayDate    = session.game_date || '';
  // 枠ごとに「これまで記録した内容と、その試合日」を集めておく。
  // 保存済みの試合データそのものを根拠にするので、判定用の記録（slotSeen）が
  // 失われていたり古くなっていても、前回の試合を今日の試合として取り込まない。
  const prevBySlot = {};
  for (const g of [...oldDisplayGames, ...oldSavedGames]) {
    if (!g.url || !g.game_date) continue;
    const k = slotKeyOf(g.region, g.round, g.url);
    (prevBySlot[k] = prevBySlot[k] || []).push({ date: g.game_date, sig: slotSignature(g) });
  }
  let requested = false;
  for (const link of links) {
    // 終了した試合は内容が変わらないので、その日のうちは取得し直さない。
    // 試合が進むほど取得対象が減り、元サイトへの負荷も待ち時間も下がる。
    const prevIdForLink = makeId(link.region, link.round, link.url, session.game_date || '');
    const prevForLink   = oldById[prevIdForLink];
    if (!fullScan && prevForLink && (prevForLink.game_status || '').includes('終了')) {
      skippedLinks.push(link);
      continue;
    }
    try {
      // 連続で叩かずに少し間を空ける
      if (requested) await sleep(REQUEST_GAP_MS);
      requested = true;
      const html = await fetchHtml(link.url);
      fetchOk++;   // ページの取得自体は成功
      const game = parseScorePage(html, link.region, link.round, link.url);
      if (game) {
        // 前に記録したときと中身が同じで、その記録が別の日のものなら、
        // 元サイトがまだ更新されていない＝今日の試合ではない
        const sKey = slotKeyOf(link.region, link.round, link.url);
        const sSig = slotSignature(game);
        const seen = slotSeen[sKey];
        // (a) 判定用の記録が「別の日に同じ内容を見た」と言っている
        const seenOnOtherDay = !!(seen && seen.sig === sSig && seen.date && seen.date !== todayDate);
        // (b) 保存済みの試合データに、同じ枠・より前の日付で同じ内容が既にある
        //     （判定用の記録が失われていても、これで前回の試合の取り込みを防げる）
        const alreadyRecordedEarlier =
          (prevBySlot[sKey] || []).some(p => p.sig === sSig && p.date < todayDate);
        if (todayDate && (seenOnOtherDay || alreadyRecordedEarlier)) {
          staleLinks.push(link);
          continue;
        }
        if (!seen || seen.sig !== sSig || seen.date !== todayDate) {
          slotSeen[sKey] = { sig: sSig, date: todayDate };
          slotSeenDirty = true;
        }
        game.game_date       = session.game_date       || '';
        game.game_date_label = session.game_date_label || '';
        // 大会名も試合そのものに持たせる。こうしておくと、日をまたいで履歴に
        // 移ったあとも「その試合が行われた大会」が分かり、後から塗り替えられない
        game.tournament_name = session.tournament_name || '';
        // 日付込みIDに更新（同じURLでも日付が変われば別試合）
        game.id = makeId(link.region, link.round, link.url, game.game_date);
        newGames.push(game);
      } else {
        // ページは取れたが試合データが無い。元サイトが深夜に当日分の表示を
        // 切り替えると終了済みの試合でもこの状態になるため、失敗と同じ扱いで
        // 前回値を引き継ぐ（本当に試合が無い枠は引き継ぐ前回値も無いので影響しない）
        emptyLinks.push(link);
      }
    } catch(e) {
      failedLinks.push(link);   // 前回値の引き継ぎに使うのでリンクごと控えておく
      console.warn('取得失敗:', link.url, e);
    }
  }
  // 取得成績（画面のステータス欄に表示する）
  const fetchStats = {
    total:   links.length,
    ok:      fetchOk,
    ng:      failedLinks.length,
    empty:   emptyLinks.length,    // 取得はできたが中身が空だった枠
    skipped: skippedLinks.length,  // 終了済みのため取得しなかった枠
    stale:   staleLinks.length,    // 内容が前回の試合日のままだった枠
    carried: 0,   // 失敗・空だった枠のうち前回値を引き継げた数（このあと確定する）
    failed:  failedLinks.map(l => l.region + ' ' + l.round),
  };
  // 実際に取得を試みた件数（スキップ分を除く）
  const attempted = links.length - skippedLinks.length;
  if (slotSeenDirty) saveSlotSeen(slotSeen);
  // 取れた枠がすべて前回の試合日のままなら、今日はまだ試合が始まっていない
  // → 取得間隔を広げて様子を見る（試合が現れれば自動で通常間隔に戻る）
  noGameMode = newGames.length === 0 && staleLinks.length > 0;

  // 取得を試みたのに1件も取れなかった場合 → 中継やネットワークの不調
  // この場合は既存データを保持し、次のクロールに期待する
  // ※「取得はできたが中身が空」と「終了済みのスキップ」は下の引き継ぎ処理で扱う
  if (attempted > 0 && fetchOk === 0) {
    const prev = loadCurrentData();
    if ((prev.games || []).length > 0) {
      saveCurrentData({ ...prev, fetch_stats: fetchStats, crawl_status: 'error', error: '試合データの取得に失敗しました（次のクロールで再試行）', last_updated: now });
      return;
    }
  }

  // 旧データ（oldData / oldDisplayGames / oldSavedGames / oldById）は
  // 終了済み枠のスキップ判定に使うため、取得ループの前で読み込み済み

  const merged = newGames.map(ng => {
    const old = oldById[ng.id];

    // イニング退行防止: 元サイトが一時的に空を返した場合のみ保持
    // ※ 同じ日付の試合に限定する（日付未設定時は適用しない）
    if (old) {
      const sameDate = (ng.game_date || '') !== '' && (ng.game_date || '') === (old.game_date || '');
      if (sameDate) {
        const oldHasInnings = (old.innings1 || []).some(v => v !== '' && v != null);
        const newHasInnings = (ng.innings1 || []).some(v => v !== '' && v != null);
        if (!newHasInnings && oldHasInnings && !(ng.game_status || '').includes('終了')) {
          ng = { ...ng, innings1: old.innings1, innings2: old.innings2, total1: old.total1, total2: old.total2 };
        }
      }
    }

    const snap = scoreSnapshot(ng);
    if (!old) return { ...ng, is_new:true, is_updated:false, confirmed_snapshot:null, last_changed:now };
    const confirmedSnap = old.confirmed_snapshot ?? null;
    let result;
    if (snap !== scoreSnapshot(old) || (ng.game_status||'') !== (old.game_status||'')) {
      result = { ...ng, is_new:false, is_updated:true, last_changed:now };
    } else {
      result = { ...ng, is_new:old.is_new||false, is_updated:old.is_updated||false, last_changed:old.last_changed||null };
    }
    result.confirmed_snapshot = confirmedSnap;
    if (confirmedSnap !== null && snap === confirmedSnap) { result.is_new=false; result.is_updated=false; }
    return result;
  });

  // ── 今回スコアを取れなかった枠は、前回の内容をそのまま引き継ぐ ──
  // 対象は「取得に失敗した枠」と「取得はできたが中身が空だった枠」の両方。
  // 中継の不調や、元サイトの深夜の表示切替で、表示中の試合や公開データから
  // 試合が消えるのを防ぐ。
  // 試合IDは（地区・試合枠・URL・試合日）から決まるので、取得できなくても前回分を特定できる。
  // 試合日が変われば別IDになるため、日付が変わった翌日に前日の試合が居座ることはない。
  const hasContent = g => (g.innings1 || []).some(v => v !== '' && v != null)
                       || (g.total1 !== '' && g.total1 != null)
                       || (g.game_status || '').includes('終了');
  const byId = Object.fromEntries(merged.map(g => [g.id, g]));
  for (const link of [...failedLinks, ...emptyLinks]) {
    const prevId = makeId(link.region, link.round, link.url, session.game_date || '');
    const prev   = oldById[prevId];
    // 中身のある前回値がある場合だけ引き継ぐ（空の枠を空のまま持ち回らない）
    if (prev && !byId[prevId] && hasContent(prev)) {
      byId[prevId] = { ...prev, is_carried_over: true };
      fetchStats.carried++;
    }
  }
  // 終了済みでスキップした枠は、前回の内容をそのまま持ち越す（異常ではないので数えない）
  for (const link of skippedLinks) {
    const prevId = makeId(link.region, link.round, link.url, session.game_date || '');
    const prev   = oldById[prevId];
    if (prev && !byId[prevId]) byId[prevId] = prev;
  }
  // 元のリンク順に並べ直す（引き継ぎ分を末尾に足すと表示位置が動いてしまうため）
  const ordered = [];
  for (const link of links) {
    const id = makeId(link.region, link.round, link.url, session.game_date || '');
    if (byId[id]) { ordered.push(byId[id]); delete byId[id]; }
  }
  ordered.push(...Object.values(byId));   // リンクと対応が取れなかった分も残す

  // ブラックリストに登録済みのゲームは復活させない
  const _deletedIds = new Set(JSON.parse(localStorage.getItem(DELETED_IDS_KEY) || '[]'));
  // displayGames = 今日のクロール分＋引き継ぎ分（モニタートップに表示）
  const displayGames = ordered.filter(g => !_deletedIds.has(g.id));

  // 自動保存: 旧displayGamesから今日のクロールに含まれなくなった実績ある試合を履歴へ
  const currentIds  = new Set(displayGames.map(g => g.id));
  const newlySaved  = oldDisplayGames.filter(g =>
    !currentIds.has(g.id) &&
    !_deletedIds.has(g.id) &&
    ((g.game_status || '').includes('終了') || (g.innings1 || []).some(v => v !== '' && v != null))
  );
  // savedGames = 既存履歴 + 新規自動保存（削除済み・displayGamesと重複するID除外）
  const savedById = Object.fromEntries(oldSavedGames.filter(g => !_deletedIds.has(g.id) && !currentIds.has(g.id)).map(g => [g.id, g]));
  newlySaved.forEach(g => { if (!savedById[g.id]) savedById[g.id] = g; });
  const savedGames = Object.values(savedById);

  // 同じ内容の試合が別の日付にまぎれていないか点検（見つけたら画面で知らせる）
  fetchStats.dupes = findCrossDateDuplicates([...displayGames, ...savedGames]);
  if (fetchStats.dupes.length) console.warn('同じ内容が別の日付にある試合:', fetchStats.dupes);

  autoConfirmNew(displayGames); // 初回出現ゲームをこのPCで自動確認
  saveCurrentData({
    games:       displayGames,   // モニター表示用（今日分のみ）
    saved_games: savedGames,     // 履歴（日をまたいで蓄積）
    fetch_stats: fetchStats,     // 取得成績（◯ページ中◯件）
    last_updated: now, crawl_status:'ok', error:null, game_count: displayGames.length
  });

  // ── 取得成功率が低いときは GitHub 書き込みを見送る ──
  // 引き継ぎで試合は消えないが、取得できていない枠のスコアは古いままなので、
  // 半端な状態を公開データに固定してしまわないよう、次のクロールに委ねる。
  const successRate = attempted ? fetchOk / attempted : 1;
  if (successRate < WRITE_MIN_SUCCESS_RATE) {
    setGhStatus('error', '⚠️ 取得成功率 ' + Math.round(successRate * 100) + '% のため書き込み見送り（次回再試行）');
    return;
  }

  // スコアに変化がなければ GitHub 書き込みをスキップ
  const hasChanges = displayGames.some(g => g.is_new || g.is_updated)
                  || displayGames.length !== oldDisplayGames.length
                  || newlySaved.length > 0
                  || savedGames.length !== oldSavedGames.filter(g => !_deletedIds.has(g.id)).length;
  if (!hasChanges) {
    setGhStatus('ok', '変更なし');
    return;
  }

  // GitHub に書き込み
  const cfg = loadConfig();
  if (!cfg.gh_token || !cfg.gh_owner || !cfg.gh_repo) {
    setGhStatus('error', '⚠️ GitHub未設定（⚙️設定）');
    return;
  }
  // 書き込みOFFの端末はスキップ（複数端末使用時の競合防止）
  if (cfg.gh_write_enabled === false) {
    setGhStatus('ok', '📖 読み取り専用（書き込みOFF）');
    return;
  }
  setGhStatus('pending', '📤 GitHub書き込み中...');
  try {
    // GitHub には今日の試合と履歴を別キーで保存（読み取り時の混在・重複を防ぐ）
    const data = {
      tournament_id:   tournamentId,
      tournament_name: session.tournament_name || '',
      game_date:       session.game_date       || '',   // 読み取り端末が自動取得するために保存
      game_date_label: session.game_date_label || '',
      games:           enrichGamesWithMeta(displayGames, session),       // 当日分のみ
      saved_games:     enrichGamesWithMeta(savedGames, session),         // 履歴（日をまたいだ蓄積）
      last_updated:    now,
    };
    await ghWrite('data/' + tournamentId + '.json', data, '試合結果更新 ' + now, mergeTournamentData);
    await updateTournamentIndex(session, displayGames.length + savedGames.length, now);
    // このIDにこの名前で書き込んだ、と記録する（次に名前だけ変えたら警告できる）
    recordIdName(tournamentId, session.tournament_name || '');
    const _now = new Date();
    const _date = _now.toLocaleDateString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/');
    const _time = _now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    setGhStatus('ok', '✅ ' + _date + '　' + _time + ' 書き込み完了');
  } catch(e) {
    setGhStatus('error', '❌ ' + e.message);
    console.error('GitHub write error:', e);
  }
}

// ═══════════════════════════════════════════════════
//  スケジューラー
// ═══════════════════════════════════════════════════
async function runCrawl(force) {
  if (isCrawling) return;
  // 夜間は元サイトも更新されないため自動クロールを休む（🔄更新ボタンはいつでも動く）
  if (!force && !isActiveHour()) {
    setGhStatus('ok', '🌙 休止中（' + ACTIVE_HOUR_START + '時〜' + ACTIVE_HOUR_END + '時に取得）');
    nextCrawlAt = Date.now() + nextIntervalMs();
    render();
    return;
  }
  isCrawling = true;
  const btn = document.getElementById('refreshBtn');
  const sp  = document.getElementById('spinner');
  btn.disabled = true; sp.style.display = 'inline-block';
  document.getElementById('statusDot').className = 'dot ing';
  document.getElementById('statusText').textContent = 'クロール中...';
  try { await fetchAndUpdate(); }
  finally {
    isCrawling = false; btn.disabled = false; sp.style.display = 'none';
    nextCrawlAt = Date.now() + nextIntervalMs();
    render();
  }
}
// 次のクロールまでの待ち時間。今日まだ試合が無いときは間隔を広げる
function nextIntervalMs() {
  const m = (noGameMode && intervalMinutes > 0)
    ? Math.max(intervalMinutes, IDLE_INTERVAL_MINUTES)
    : intervalMinutes;
  return m * 60 * 1000;
}
// 間隔が状況で変わるので、一定間隔の setInterval ではなく毎回組み直す
function startScheduler() {
  if (crawlTimer) { clearTimeout(crawlTimer); crawlTimer = null; }
  const tick = async () => {
    crawlTimer = null;
    await runCrawl();
    if (intervalMinutes > 0) crawlTimer = setTimeout(tick, nextIntervalMs());
  };
  crawlTimer = setTimeout(tick, nextIntervalMs());
}

// 「更新なし」モード：スクレイピングせず GitHub Pages JSON を取得して再描画
async function refreshDisplay() {
  const session = loadSession();
  const tid = session.tournament_id;
  if (tid) {
    const base = location.href.replace(/\?.*$/, '').replace(/[^/]*$/, '');
    try {
      const res = await fetch(base + 'data/' + encodeURIComponent(tid) + '.json?_=' + Date.now());
      if (res.ok) {
        const data = await res.json();
        const deletedIds = new Set(JSON.parse(localStorage.getItem(DELETED_IDS_KEY) || '[]'));

        // 読み取り専用端末: 書き込みPCの大会名・試合日を自動取得して反映
        let todayDate = session.game_date || '';
        const cfg = loadConfig();
        if (cfg.gh_write_enabled === false) {
          const updSes = { ...session };
          let sessChanged = false;
          if (data.tournament_name && data.tournament_name !== updSes.tournament_name) {
            updSes.tournament_name = data.tournament_name;
            document.getElementById('sesName').value = data.tournament_name;
            sessChanged = true;
          }
          if (data.game_date && (!updSes.game_date || data.game_date > updSes.game_date)) {
            updSes.game_date       = data.game_date;
            updSes.game_date_label = data.game_date_label || '';
            document.getElementById('sesDate').value            = data.game_date;
            document.getElementById('sesDateLabel').textContent = data.game_date_label || '';
            document.getElementById('sesDateLabel').style.display = data.game_date ? '' : 'none';
            todayDate = data.game_date; // 新しい日付でフィルタ
            sessChanged = true;
          }
          if (sessChanged) localStorage.setItem(SESSION_KEY, JSON.stringify(updSes));
        }
        // GitHub の games（当日分）と saved_games（履歴）を別キーで読み取る
        // 旧形式（saved_gamesキーなし）との互換性のため games の日付フィルタも維持
        const rawDisplay = (data.games || []).filter(g => !deletedIds.has(g.id));
        const rawSaved   = (data.saved_games || []).filter(g => !deletedIds.has(g.id));
        const displayGames = todayDate
          ? rawDisplay.filter(g => g.game_date === todayDate)
          : rawDisplay;
        const spillOver    = todayDate
          ? rawDisplay.filter(g => g.game_date !== todayDate)  // 旧形式の日付違いを履歴へ
          : [];
        // 重複IDを除去してから savedGames を確定
        const displayIds  = new Set(displayGames.map(g => g.id));
        const savedGames  = [
          ...spillOver.filter(g => !displayIds.has(g.id)),
          ...rawSaved.filter(g => !displayIds.has(g.id)),
        ].filter((g, i, arr) => arr.findIndex(x => x.id === g.id) === i); // ID重複除去
        // GitHubが空・日付不一致の場合はローカルのクロールデータを保持する
        // （書き込み端末がまだ今日のデータを書いていないケース等）
        if (displayGames.length === 0) {
          const existingGames = loadCurrentData().games || [];
          if (existingGames.length > 0) {
            nextRefreshAt = Date.now() + 60 * 1000;
            render();
            return;
          }
        }
        autoConfirmNew(displayGames);
        saveCurrentData({
          games:       displayGames,
          saved_games: savedGames,
          last_updated: data.last_updated || null,
          crawl_status: 'ok', error: null, game_count: displayGames.length
        });
      }
    } catch(e) { console.warn('表示更新失敗:', e); }
  }
  nextRefreshAt = Date.now() + 60 * 1000;
  render();
}
function startReloadScheduler() {
  if (crawlTimer) { clearTimeout(crawlTimer); crawlTimer = null; }
  if (reloadTimer) clearInterval(reloadTimer);
  nextRefreshAt = Date.now() + 60 * 1000;
  reloadTimer = setInterval(refreshDisplay, 60 * 1000);
}

function setInterval_(val) {
  intervalMinutes = parseInt(val);
  const cfg = loadConfig(); cfg.interval_minutes = intervalMinutes; saveConfig(cfg);
  if (intervalMinutes === 0) {
    if (crawlTimer) { clearTimeout(crawlTimer); crawlTimer = null; }
    startReloadScheduler();
  } else {
    if (reloadTimer) { clearInterval(reloadTimer); reloadTimer = null; nextRefreshAt = null; }
    nextCrawlAt = Date.now() + nextIntervalMs();
    startScheduler();
  }
}
function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    checkDateRollover();   // 日をまたいだら試合日を繰り上げる
    if (intervalMinutes === 0) {
      if (!nextRefreshAt) return;
      const s = Math.max(0, Math.ceil((nextRefreshAt - Date.now()) / 1000));
      document.getElementById('countdown').textContent = '次の表示更新まで ' + s + '秒';
    } else {
      if (!nextCrawlAt) return;
      const s = Math.max(0, Math.ceil((nextCrawlAt - Date.now()) / 1000));
      const m = Math.floor(s / 60), sec = s % 60;
      document.getElementById('countdown').textContent =
        '次のクロールまで ' + (m > 0 ? m + '分' : '') + sec + '秒';
    }
  }, 1000);
}
// 🔄更新ボタン：夜間でも、終了済み枠も含めて必ず全件取得する
async function manualCrawl() {
  crawlCount = 0;   // 次の fullScan 判定が必ず true になるようにする
  await runCrawl(true);
}

// ═══════════════════════════════════════════════════
//  UI 描画
// ═══════════════════════════════════════════════════
function esc(s) {
  return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmt(iso) {
  if (!iso) return '';
  // toISOString() で保存した文字列は UTC だが末尾の Z が省略されている場合があるため補完
  const s = (iso.endsWith('Z') || iso.includes('+')) ? iso : iso + 'Z';
  return new Date(s).toLocaleTimeString('ja-JP', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function pad(arr, n) { const a = [...arr]; while (a.length < n) a.push(''); return a; }
function effectiveInnCount(inn1, inn2) {
  let max = 9;
  const len = Math.max((inn1||[]).length, (inn2||[]).length);
  for (let i = 9; i < len; i++) {
    const v1 = (inn1||[])[i] != null ? String((inn1||[])[i]) : '';
    const v2 = (inn2||[])[i] != null ? String((inn2||[])[i]) : '';
    if (v1 !== '' || v2 !== '') max = i + 1;
  }
  return max;
}
function winLose(t1, t2) {
  const a = parseInt(t1), b = parseInt(t2);
  if (isNaN(a)||isNaN(b)) return [null,null];
  return a>b ? [true,false] : a<b ? [false,true] : [null,null];
}
function statusBadge(g, confirmed) {
  const s    = g.game_status || '';
  const isEnd = s.includes('終了');
  const inn1  = g.innings1 || [];
  // 試合中：1回表に数値が入った時点
  const isPlaying = !isEnd && inn1[0] !== '' && inn1[0] != null;
  // NEW：チーム名はあるがまだ1回表が未記録
  const isNew = !isEnd && !isPlaying && !!(g.team1 || g.team2);
  const { updated } = localUpdateInfo(g, confirmed); // このPCの確認状態で判定

  if (updated)   return '<span class="badge updated" onclick="confirmGame(event,\''+esc(g.id)+'\')" title="クリックで確認（赤字を消す）">更新 ✓</span>';
  if (isEnd)     return '<span class="badge ended">終了</span>';
  if (isPlaying) return '<span class="badge playing">試合中</span>';
  if (isNew)     return '<span class="badge new">NEW</span>';
  return '';
}

function buildCard(g) {
  const confirmed = loadConfirmed();
  const { updated: isUpdatedLocal, prevSnap } = localUpdateInfo(g, confirmed);
  const innCount = effectiveInnCount(g.innings1, g.innings2);
  const inn1 = pad(g.innings1||[], innCount).slice(0, innCount);
  const inn2 = pad(g.innings2||[], innCount).slice(0, innCount);
  const [w1, w2] = winLose(g.total1, g.total2);
  const cardCls  = isUpdatedLocal ? 'is-updated' : '';
  const isOpen   = openCards.has(g.id);
  const btnLabel = isOpen ? 'スコアのみ ▲' : '詳細 ▼';
  const changedAt = '';

  let th = '<th class="team-name">チーム</th>';
  for (let i = 1; i <= inn1.length; i++) th += '<th>' + i + '</th>';
  th += '<th>計</th>';

  const snap = (isUpdatedLocal && prevSnap) ? prevSnap : null;
  const row  = (name, inns, total, win, snapInns, snapTotal) => {
    let r = '<tr><td class="team-name">' + (esc(name)||'(未定)') + '</td>';
    inns.forEach((s, i) => {
      const ok = s !== '' && s != null;
      const changed = isUpdatedLocal ? (snap ? s !== (snapInns?.[i]??'') : ok) : false;
      r += '<td class="inn'+(ok?' scored':'')+(changed?' changed':'')+'">'+( ok?esc(s):'−')+'</td>';
    });
    const wc = win===true?'win':win===false?'lose':'';
    const tc = isUpdatedLocal ? (snap ? total!==snapTotal : !!total) : false;
    r += '<td class="total '+wc+(tc?' changed':'')+'">'+( esc(total)||'−')+'</td></tr>';
    return r;
  };

  const comm     = g.commentary || '';
  const commHtml = comm
    ? '<button class="commentary-toggle" onclick="toggleComm(this)">📋 試合経過を表示</button>'
      +'<div class="commentary-body">'+esc(comm)+'</div>'
    : '';

  return '<div class="game-card '+cardCls+'" data-id="'+esc(g.id)+'">'
    +'<div class="card-header" onclick="toggleCard(this)">'
    +'<span class="card-round-wrap">'
    +'<span class="card-round">'+esc(g.round)+'</span>'
    +statusBadge(g, confirmed)
    +'</span>'
    +changedAt
    +'<button class="card-toggle-btn">'+btnLabel+'</button>'
    +'</div>'
    +'<div class="card-score">'
    +'<table class="score-table"><thead><tr>'+th+'</tr></thead><tbody>'
    +row(g.team1,inn1,g.total1,w1,snap?.innings1,snap?.total1)
    +row(g.team2,inn2,g.total2,w2,snap?.innings2,snap?.total2)
    +'</tbody></table>'
    +'</div>'
    +'<div class="card-detail '+(isOpen?'':'collapsed')+'">'
    +commHtml
    +buildMetaPanel(g)
    +buildNotePanel(g)
    +buildEmbedPanel(g)
    +'</div></div>';
}

  const gid = esc(g.id);
  return '<div class="meta-panel">'

    +'</div>'
    // ── 行2：チーム名 ──
    +'<div class="meta-row" style="flex-wrap:wrap;margin-bottom:0;gap:6px 10px;">'

async function saveNote(gameId) {
  const ta = document.getElementById('note-ta-' + gameId);
  if (!ta) return;
  const note = ta.value.trim();

  // localStorage 保存
  const meta = loadGameMeta();
  if (!meta[gameId]) meta[gameId] = {};
  meta[gameId].note = note;
  saveGameMeta(meta);

  const cfg     = loadConfig();
  const session = loadSession();
  const tid     = session.tournament_id;
  if (!cfg.gh_token || !tid) { alert('✅ ローカルに保存しました。\n（GitHub設定または大会IDが未設定のためGitHubへの書き込みはスキップしました）'); return; }

  const btn  = ta.parentElement.querySelector('.meta-save-btn') || ta.nextElementSibling;
  const orig = btn?.textContent || '';
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    // saved_games（履歴）と game_date_label も必ず含めること。
    // 一部のキーだけを書くと、GitHub上のファイルからそれ以外が消えてしまう。
    const cur      = loadCurrentData();
    const enriched = enrichGamesWithMeta(cur.games || [], session);
    const now      = new Date().toISOString().slice(0, 19);
    await ghWrite('data/' + tid + '.json', {
      tournament_id:   tid,
      tournament_name: session.tournament_name || '',
      game_date:       session.game_date       || '',
      game_date_label: session.game_date_label || '',
      games:           enriched,
      saved_games:     enrichGamesWithMeta(cur.saved_games || [], session),
      last_updated:    now,
    }, 'テキスト更新: ' + gameId, mergeTournamentData);
    if (btn) btn.textContent = '✅ 保存しました';
    setTimeout(() => { if (btn) { btn.disabled = false; btn.textContent = orig; } }, 2500);
  } catch(e) {
    if (btn) btn.textContent = '❌ ' + e.message;
    setTimeout(() => { if (btn) { btn.disabled = false; btn.textContent = orig; } }, 4000);
  }
}

async function saveCustomNote(id) {
  const ta = document.getElementById('note-ta-' + id);
  if (!ta) return;
  const note = ta.value.trim();

  const btn  = ta.parentElement.querySelector('.meta-save-btn') || ta.nextElementSibling;
  const orig = btn?.textContent || '';

  // キャッシュを更新
  const cached = cachedManualScores.find(s => s.id === id);
  if (cached) cached.game.note = note;

  const cfg = loadConfig();
  if (!cfg.gh_token || !cfg.gh_owner || !cfg.gh_repo) { alert('GitHub設定が必要です。'); return; }
  if (btn) { btn.disabled = true; btn.textContent = '保存中...'; }
  try {
    const path = 'data/' + id + '.json';
    const existing = await ghRead(path);
    let content = { last_updated: new Date().toISOString(), games: [] };
    if (existing?.content) {
      const bin = atob(existing.content.replace(/\n/g, ''));
      content = JSON.parse(new TextDecoder('utf-8').decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    }
    if (content.games?.[0]) content.games[0].note = note;
    content.last_updated = new Date().toISOString();
    await ghWrite(path, content, 'テキスト更新: ' + id);
    if (btn) btn.textContent = '✅ 保存しました';
    setTimeout(() => { if (btn) { btn.disabled = false; btn.textContent = orig; } }, 2500);
  } catch(e) {
    if (btn) btn.textContent = '❌ ' + e.message;
    setTimeout(() => { if (btn) { btn.disabled = false; btn.textContent = orig; } }, 4000);
  }
}

function renderGames(games) {
  if (!games?.length)
    return '<div class="no-games">試合データがありません。<br>試合がある日は自動クロールされます。</div>';
  const visible = games.filter(g => !HIDDEN_REGIONS.some(kw => (g.region||'').includes(kw)));
  if (!visible.length)
    return '<div class="no-games">試合データがありません。</div>';
  const byRegion = {};
  for (const g of visible) { const k=g.region||'不明'; if(!byRegion[k])byRegion[k]=[]; byRegion[k].push(g); }
  const entries = Object.entries(byRegion);
  // 奇数インデックス→左列、偶数インデックス→右列（読み順：左右左右…）
  const leftCol  = entries.filter((_, i) => i % 2 === 0);
  const rightCol = entries.filter((_, i) => i % 2 === 1);
  const buildSection = ([region, gs]) =>
    '<div class="region-section" data-region="'+esc(region)+'">'
    +'<div class="region-header">'
    +'<span>🏟 '+esc(region)+'</span>'
    +'<button class="region-toggle-btn" onclick="toggleRegion(this)">閉じる</button>'
    +'</div>'
    + gs.map(buildCard).join('') + '</div>';
  return '<div class="region-grid">'
    + '<div class="region-col">' + leftCol.map(buildSection).join('') + '</div>'
    + '<div class="region-col">' + rightCol.map(buildSection).join('') + '</div>'
    + '</div>';
}

function render() {
  const d       = loadCurrentData();
  const session = loadSession();
  // メタ情報（チーム名・ヘッダー情報）を適用してから描画
  const games   = enrichGamesWithMeta(d.games || [], session);
  const ok    = d.crawl_status !== 'error';
  const last  = d.last_updated ? fmt(d.last_updated) : '未取得';
  const count = games.filter(g => !HIDDEN_REGIONS.some(kw => (g.region||'').includes(kw))).length;
  document.getElementById('statusDot').className  = 'dot ' + (ok ? 'ok' : 'err');
  document.getElementById('statusText').textContent = ok
    ? (count === 0 && (d.fetch_stats?.stale || 0) > 0
        ? '本日はまだ試合がありません'
        : count + '試合')
    : 'エラー: ' + (d.error || '不明');
  // 取得成績（◯ページ中◯件取得）。失敗があれば赤字にし、内訳はマウスを載せると出る
  const fsEl = document.getElementById('fetchStats');
  if (fsEl) {
    const st = d.fetch_stats;
    if (st && st.total) {
      fsEl.textContent = st.total + 'ページ中 ' + st.ok + '件取得'
        + (st.skipped > 0 ? '・' + st.skipped + '件スキップ' : '')
        + (st.stale   > 0 ? '・' + st.stale   + '件は前回の試合日のまま' : '')
        + (st.ng      > 0 ? '／' + st.ng      + '件失敗' : '')
        + (st.empty   > 0 ? '／' + st.empty   + '件は空' : '')
        + (st.carried > 0 ? '（' + st.carried + '件は前回値を表示）' : '');
      const dupes = st.dupes || [];
      if (dupes.length) fsEl.textContent += '／⚠️ 日付重複 ' + dupes.length + '件';
      fsEl.className = 'fetch-stats' + (st.ng > 0 || dupes.length ? ' warn' : '');
      fsEl.title     = [
        st.ng > 0      ? '失敗: ' + (st.failed || []).join('、') : '',
        st.skipped > 0 ? 'スキップ: 終了済みのため取得を省いた枠（' + st.skipped + '件）' : '',
        st.stale > 0   ? '前回の試合日のまま: 元サイトが未更新のため今日の試合として登録していない枠（' + st.stale + '件）' : '',
        dupes.length   ? '同じ内容の試合が別の日付にもあります（要確認）:\n  ' + dupes.join('\n  ') : '',
      ].filter(Boolean).join('\n');
    } else {
      fsEl.textContent = '';
      fsEl.className   = 'fetch-stats';
      fsEl.title       = '';
    }
  }
  document.getElementById('content').innerHTML = renderGames(games);
  // 閉じていた会場を復元
  const collapsedRgns = new Set(JSON.parse(localStorage.getItem(COLLAPSED_RGNS_KEY) || '[]'));
  document.querySelectorAll('.region-section[data-region]').forEach(sec => {
    if (collapsedRgns.has(sec.dataset.region)) {
      sec.querySelectorAll('.game-card').forEach(c => c.style.display = 'none');
      const btn = sec.querySelector('.region-toggle-btn');
      if (btn) btn.textContent = '開く';
    }
  });
}
